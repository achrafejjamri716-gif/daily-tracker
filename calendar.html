<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar · Daily Tracker</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="calendar">
  <div class="app-shell">
    <div id="shell"></div>
    <main class="main-content">
      <header id="topbar" class="topbar"></header>
      <div class="page-content">

        <div class="card fade-in">
          <div class="cal-header">
            <h3 id="calMonthLabel" class="font-display" style="font-size:1.2rem;"></h3>
            <div class="cal-nav">
              <button class="btn-icon" id="calPrev">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
              </button>
              <button class="btn-icon" id="calNext">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
              </button>
            </div>
          </div>
          <div class="cal-grid" style="margin-bottom:8px;">
            <div class="cal-dow">Sun</div><div class="cal-dow">Mon</div><div class="cal-dow">Tue</div>
            <div class="cal-dow">Wed</div><div class="cal-dow">Thu</div><div class="cal-dow">Fri</div><div class="cal-dow">Sat</div>
          </div>
          <div class="cal-grid" id="calGrid"></div>
          <div class="cal-legend">
            <span><span class="legend-swatch" style="background:linear-gradient(135deg,var(--mauve-600),var(--mauve-400));"></span>All habits completed</span>
            <span><span class="legend-swatch" style="background:var(--surface-2); border:2px solid var(--mauve-600);"></span>Today</span>
            <span>Click any day to see details</span>
          </div>
        </div>

      </div>
    </main>
  </div>

  <div class="modal-overlay" id="dayModalOverlay">
    <div class="modal">
      <div class="modal-head">
        <h3 id="dayModalTitle">Day details</h3>
        <button class="modal-close" id="dayModalClose">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="dayModalBody"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
