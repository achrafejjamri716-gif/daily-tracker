<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard · Daily Tracker</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="dashboard">
  <div class="app-shell">
    <div id="shell"></div>
    <main class="main-content">
      <header id="topbar" class="topbar"></header>
      <div class="page-content">

        <div class="grid grid-4 mb-4">
          <div class="card stat-card">
            <div class="stat-icon" style="background:linear-gradient(135deg,#7a5075,#af7fa8)">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
            </div>
            <div class="stat-value" id="statTotalHabits">0</div>
            <div class="stat-label">Total habits</div>
          </div>
          <div class="card stat-card">
            <div class="stat-icon" style="background:linear-gradient(135deg,#e2a542,#f0c26c)">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
            </div>
            <div class="stat-value" id="statActiveStreaks">0</div>
            <div class="stat-label">Active streaks</div>
          </div>
          <div class="card stat-card">
            <div class="stat-icon" style="background:linear-gradient(135deg,#6c93c9,#8fb3e8)">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>
            </div>
            <div class="stat-value" id="statActiveGoals">0</div>
            <div class="stat-label">Active goals</div>
          </div>
          <div class="card stat-card">
            <div class="stat-icon" style="background:linear-gradient(135deg,#5fb88f,#7fd0ab)">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V10M18 20V4M6 20v-6"/></svg>
            </div>
            <div class="stat-value" id="statLongestStreak">0</div>
            <div class="stat-label">Longest streak (days)</div>
          </div>
        </div>

        <div class="grid grid-2" style="grid-template-columns:1.1fr 1.4fr;">
          <div class="card fade-in">
            <div class="section-head"><h3>Today's progress</h3></div>
            <div class="ring-wrap">
              <canvas id="dashRing" width="220" height="220" style="width:200px;height:200px;"></canvas>
              <div class="ring-label"><b id="dashProgressLabel">0%</b><span>completed today</span></div>
            </div>
          </div>
          <div class="card fade-in">
            <div class="section-head"><h3>Last 7 days</h3><span class="chip">Completion rate</span></div>
            <canvas id="dashWeekChart" style="width:100%; height:200px;"></canvas>
          </div>
        </div>

        <div class="grid grid-2 mt-4" style="grid-template-columns:1.6fr 1fr;">
          <div class="card fade-in">
            <div class="section-head">
              <h3>Today's habits</h3>
              <a href="habits.html" class="btn btn-ghost btn-sm">View all</a>
            </div>
            <div class="habit-list" id="dashTodayList"></div>
          </div>
          <div class="card fade-in">
            <div class="section-head">
              <h3>Active goals</h3>
              <a href="goals.html" class="btn btn-ghost btn-sm">View all</a>
            </div>
            <div id="dashGoalsPreview"></div>
          </div>
        </div>

      </div>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
